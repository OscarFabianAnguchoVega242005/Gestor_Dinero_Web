<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiPlata — Acceder</title>
  <link rel="icon" type="image/png" href="gestor_dinero_icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d14; --surface: #16162a; --surfaceL: #1e1e38; --border: #2a2a45;
      --purple: #7c5cbf; --purpleL: #a855f7; --purpleP: #c084fc;
      --green: #4ade80; --red: #f87171; --textP: #f0eff5; --textS: #888; --textM: #555;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--textP);
      min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 30px 20px;
      overflow-x: hidden; overflow-y: auto;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18;
    }
    .blob-1 {
      width: 500px; height: 500px; background: #a855f7;
      top: -100px; left: -100px;
      animation: blobFloat1 10s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 400px; height: 400px; background: #7c5cbf;
      bottom: -80px; right: -80px;
      animation: blobFloat2 12s ease-in-out infinite alternate;
    }
    .blob-3 {
      width: 250px; height: 250px; background: #c084fc;
      top: 50%; left: 50%;
      animation: blobFloat3 8s ease-in-out infinite alternate;
    }

    @keyframes blobFloat1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(60px, 40px) scale(1.15); }
    }
    @keyframes blobFloat2 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(-50px, -30px) scale(1.1); }
    }
    @keyframes blobFloat3 {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-40%, -60%) scale(1.2); }
    }

    /* Floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute; border-radius: 50%;
      background: var(--purpleP); opacity: 0;
      animation: particleFly linear infinite;
    }

    @keyframes particleFly {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
    }

    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 40px 36px; width: 100%; max-width: 440px;
      animation: fadeUp .6s cubic-bezier(0.22, 1, 0.36, 1) both;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(168,85,247,0.08) inset;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }

    /* ── LOGO ANIMATIONS ── */
    .logo-wrap { margin-bottom: 4px; position: relative; display: inline-block; }

    .logo {
      font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 6px;
      animation: logoAppear 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .logo-text {
      background: linear-gradient(135deg, var(--purpleP) 0%, #818cf8 50%, var(--purpleP) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
      filter: drop-shadow(0 0 20px rgba(168,85,247,0.4));
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes logoAppear {
      from { opacity: 0; transform: translateY(-12px) scale(0.92); filter: drop-shadow(0 0 0px rgba(168,85,247,0)); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: drop-shadow(0 0 20px rgba(168,85,247,0.4)); }
    }

    /* Glowing underline */
    .logo-wrap::after {
      content: '';
      display: block;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purpleP), transparent);
      border-radius: 2px;
      transform: scaleX(0);
      animation: lineReveal 0.8s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes lineReveal {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }

    /* Emoji bounce */
    .logo-emoji {
      display: inline-block;
      animation: emojiBounce 2s 1s ease-in-out infinite;
    }

    @keyframes emojiBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-4px) rotate(-8deg); }
      75%  { transform: translateY(-2px) rotate(8deg); }
    }

    .logo-sub {
      font-size: 12px; color: var(--textM); margin-bottom: 32px;
      animation: fadeUp .6s .15s both;
      letter-spacing: 0.04em;
    }

    /* Tabs */
    .tabs {
      display: flex; background: var(--surfaceL); border-radius: 12px; padding: 4px; margin-bottom: 28px;
      animation: fadeUp .6s .2s both;
    }
    .tab {
      flex: 1; padding: 10px; border: none; background: transparent; color: var(--textM);
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      border-radius: 9px; cursor: pointer; transition: all .25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab.active { background: var(--purpleL); color: #fff; box-shadow: 0 4px 16px rgba(168,85,247,0.35); }
    .tab:not(.active):hover { color: var(--textP); }

    /* Forms */
    #form-login, #form-register { animation: formFadeIn .35s ease both; }
    @keyframes formFadeIn { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:translateX(0); } }

    .form-group { margin-bottom: 16px; animation: fadeUp .5s both; }
    .form-group:nth-child(1) { animation-delay: .25s; }
    .form-group:nth-child(2) { animation-delay: .32s; }
    .form-group:nth-child(3) { animation-delay: .39s; }
    .form-group:nth-child(4) { animation-delay: .46s; }

    label { display: block; font-size: 12px; color: var(--textS); margin-bottom: 6px; letter-spacing: 0.03em; }

    /* Password wrapper */
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 44px; }

    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--textM);
      display: flex; align-items: center; justify-content: center;
      padding: 4px; border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .toggle-pass:hover { color: var(--purpleP); background: rgba(168,85,247,0.1); }
    .toggle-pass svg { width: 18px; height: 18px; pointer-events: none; }

    input {
      width: 100%; background: var(--surfaceL); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--textP);
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
      transition: border .2s, box-shadow .2s, background .2s;
    }
    input:focus {
      border-color: var(--purpleL);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
      background: rgba(30,30,56,0.9);
    }
    input::placeholder { color: var(--textM); }

    select {
      width: 100%; background: var(--surfaceL); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--textP);
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
      cursor: pointer; transition: border .2s, box-shadow .2s;
    }
    select:focus { border-color: var(--purpleL); box-shadow: 0 0 0 3px rgba(168,85,247,0.15); }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all .25s cubic-bezier(0.22, 1, 0.36, 1); margin-top: 8px;
      animation: fadeUp .5s .5s both;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--purple), var(--purpleL));
      color: #fff; position: relative; overflow: hidden;
    }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0s;
    }
    .btn-primary:hover::before { transform: translateX(100%); transition: transform .5s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .msg { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 13px; display: none; }
    .msg.error   { background: rgba(248,113,113,.12); color: var(--red);   border: 1px solid rgba(248,113,113,.25); display: block; animation: shake .4s; }
    .msg.success { background: rgba(74,222,128,.12);  color: var(--green); border: 1px solid rgba(74,222,128,.25);  display: block; animation: fadeUp .3s; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%  { transform: translateX(-6px); }
      40%  { transform: translateX(6px); }
      60%  { transform: translateX(-4px); }
      80%  { transform: translateX(4px); }
    }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .period-hint { font-size: 11px; color: var(--textM); margin-top: 6px; }
  </style>
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="logo-wrap">
      <div class="logo"><span class="logo-text">MiPlata</span><span class="logo-emoji">💜</span></div>
    </div>
    <div class="logo-sub">Control financiero personal</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="tab" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Login -->
    <div id="form-login">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="login-email" placeholder="tu@correo.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="login-pass" placeholder="••••••••" />
          <button class="toggle-pass" type="button" onclick="togglePassword('login-pass', this)" aria-label="Ver contraseña">
            <svg id="eye-login" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-login" onclick="handleLogin()">Entrar</button>
    </div>

    <!-- Register -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="reg-name" placeholder="¿Cómo te llamas?" />
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="reg-email" placeholder="tu@correo.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" />
          <button class="toggle-pass" type="button" onclick="togglePassword('reg-pass', this)" aria-label="Ver contraseña">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>¿Cada cuánto recibes tu sueldo?</label>
        <select id="reg-period">
          <option value="weekly">Semanal</option>
          <option value="biweekly">Quincenal</option>
          <option value="monthly">Mensual</option>
        </select>
        <div class="period-hint">Esto define cómo se agrupan tus movimientos. Se puede cambiar después en Configuración.</div>
      </div>
      <button class="btn btn-primary" id="btn-register" onclick="handleRegister()">Crear cuenta</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    /* ── PARTICLES ── */
    (function() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        p.style.cssText = `
          width:${size}px; height:${size}px;
          left:${Math.random() * 100}%;
          bottom:-${size}px;
          animation-duration:${Math.random() * 12 + 8}s;
          animation-delay:${Math.random() * 10}s;
          opacity:0;
        `;
        container.appendChild(p);
      }
    })();

    /* ── TABS ── */
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.tab');
      document.getElementById('form-login').style.display    = tab === 'login' ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
      tabs[0].classList.toggle('active', tab === 'login');
      tabs[1].classList.toggle('active', tab === 'register');

      // re-trigger form animation
      const form = document.getElementById('form-' + tab);
      form.style.animation = 'none';
      requestAnimationFrame(() => { form.style.animation = ''; });

      document.getElementById('msg').className = 'msg';
    }

    /* ── PASSWORD TOGGLE ── */
    const EYE_OPEN = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
    const EYE_OFF  = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const svg   = btn.querySelector('svg');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      svg.innerHTML = isHidden ? EYE_OFF : EYE_OPEN;
      btn.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Ver contraseña');
      // small scale pop
      btn.style.transform = 'translateY(-50%) scale(1.3)';
      setTimeout(() => btn.style.transform = 'translateY(-50%) scale(1)', 150);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
